upstream backend {
    server dobs-backend:8050;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # App-Icons werden vom Backend in ACCENT_COLOR erzeugt (exakte Treffer
    # haben Vorrang vor der Regex-Regel für statische Dateien unten).
    location = /favicon.ico {
        proxy_pass http://backend/api/icons/favicon.ico;
    }

    location = /apple-touch-icon.png {
        proxy_pass http://backend/api/icons/apple-touch-icon.png;
    }

    # Statische Dateien direkt servieren (NICHT zu index.html)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React-Routes: NUR HTML-Seiten zu index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
