# Variant without Traefik: the frontend is published directly on the host at
# ${PORT} (plain HTTP - put your own reverse proxy in front for HTTPS).
# Same env vars as docker-compose.yml, minus DOMAIN; PORT here is the host
# port the app is reachable on.
services:
  dobs-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.alpine
    container_name: dobs-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      # The backend always listens on 8050 inside the stack; frontend/nginx.conf
      # expects exactly that.
      - PORT=8050
      - JWT_SECRET=${JWT_SECRET}
      - ACCENT_COLOR=${ACCENT_COLOR}
    volumes:
      - ${BASE_DIR}/${BINDS}/data:/app/data
    expose:
      - "8050"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  dobs-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.alpine
    container_name: dobs-frontend
    restart: unless-stopped
    ports:
      - "${PORT}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - dobs-backend

  dobs-sqlite-web:
    image: coleifer/sqlite-web
    container_name: dobs-sqlite-web
    restart: always
    profiles: ["tools"]
    user: "999:999"
    command: sqlite_web -H 0.0.0.0 -x /data/dobs.db
    ports:
      - "127.0.0.1:${SQLITE_WEB_PORT}:8080"
    volumes:
      - ${BASE_DIR}/${BINDS}/data:/data
