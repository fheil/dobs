# Variant without Traefik: the frontend is published directly on the host at
# ${PORT} (plain HTTP - put your own reverse proxy in front for HTTPS).
# Same env vars as docker-compose.yml, minus DOMAIN; PORT here is the host
# port the app is reachable on.

# Optional proxy for the image builds (npm install needs registry.npmjs.org).
# Empty when unset; Docker treats these as predefined build args, so they are
# not stored in the image.
x-proxy-args: &proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-}

services:
  dobs-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args: *proxy-args
    container_name: dobs-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV}
      # The backend always listens on 8050 inside the stack; frontend/nginx.conf
      # expects exactly that.
      - PORT=8050
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ACCENT_COLOR=${ACCENT_COLOR}
    volumes:
      - ${BASE_DIR}/${BINDS}/data:/app/data
    expose:
      - "8050"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 8050) + '/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  dobs-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args: *proxy-args
    container_name: dobs-frontend
    restart: unless-stopped
    ports:
      - "${PORT}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - dobs-backend

  dobs-sqlite-web:
    image: coleifer/sqlite-web
    container_name: dobs-sqlite-web
    restart: always
    profiles: ["tools"]
    user: "999:999"
    command: sqlite_web -H 0.0.0.0 -x /data/dobs.db
    ports:
      - "127.0.0.1:${SQLITE_WEB_PORT}:8080"
    volumes:
      - ${BASE_DIR}/${BINDS}/data:/data
